# Builds the msiecfexport binaries that Cyber Triage ships, for Windows x64 and
# Linux x86-64, from the dependency versions pinned in ct/dependencies.txt.
# Every run keeps the binaries as workflow artifacts. Pushing a ct-* tag also
# publishes them, with SHA256SUMS, as a GitHub release. See ct/README.md.
name: ct_release
on:
  push:
    branches:
    - ct
    tags:
    - 'ct-*'
  pull_request:
    branches:
    - ct
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Name the build
      id: name
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="$(git rev-parse --short=12 HEAD)"; fi
        echo "package=msiecfexport-${NAME}-windows-x64" >> "${GITHUB_OUTPUT}"
    - name: Install build dependencies
      run: |
        $VSToolsCommit = (Select-String -Path ct\dependencies.txt -Pattern '^vstools\s+(\S+)').Matches[0].Groups[1].Value
        git clone --quiet https://github.com/libyal/vstools.git ..\vstools
        git -C ..\vstools checkout --quiet ${VSToolsCommit}
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Download test data
      run: |
        .\synctestdata.ps1
    - name: Build from source
      # Converts and builds the solution directly instead of through build.ps1,
      # because build.ps1 pulls the latest vstools and would undo the pin.
      run: |
        .\synclibs.ps1
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        .\autogen.ps1
        ${Env:PYTHONPATH} = "..\vstools"
        python ..\vstools\vstools\scripts\msvscpp_convert.py --output-format 2022 --extend-with-x64 --no-python-dll --python-path "${Env:pythonLocation}" msvscpp\libmsiecf.sln
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        $MSBuild = & "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
        & ${MSBuild} /verbosity:minimal /target:Build /property:Configuration=Release /property:Platform=x64 /property:PlatformToolset=v143 vs2022\libmsiecf.sln
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Run tests
      run: |
        .\runtests.ps1
    - name: Run smoke test
      run: |
        python ct\smoke_test.py vs2022\Release\x64\msiecfexport.exe tests\input\public\index.dat
    - name: Package
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        $VCRuntime = & "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Redist\MSVC\**\vcruntime140.dll" | Where-Object { $_ -match '\\MSVC\\[^\\]+\\x64\\Microsoft\.VC\d+\.CRT\\vcruntime140\.dll$' } | Select-Object -Last 1
        If (-Not ${VCRuntime}) { Write-Error "Missing x64 vcruntime140.dll"; Exit 1 }
        New-Item -ItemType Directory -Path "dist\${Env:PACKAGE}" | Out-Null
        Copy-Item -Path vs2022\Release\x64\msiecfexport.exe, vs2022\Release\x64\libmsiecf.dll, ${VCRuntime} -Destination "dist\${Env:PACKAGE}"
        Copy-Item -Path COPYING, COPYING.LESSER, ct\dependencies.txt -Destination "dist\${Env:PACKAGE}"
        @(
          "msiecfexport, built from libmsiecf for Cyber Triage."
          "Source:  ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/tree/${Env:GITHUB_SHA}"
          "Build:   ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/actions/runs/${Env:GITHUB_RUN_ID}"
          "Licence: LGPL-3.0-or-later; see COPYING.LESSER and COPYING."
          "Dependency versions: see dependencies.txt."
        ) | Set-Content -Path "dist\${Env:PACKAGE}\SOURCE.txt" -Encoding ascii
        Compress-Archive -Path "dist\${Env:PACKAGE}" -DestinationPath "dist\${Env:PACKAGE}.zip"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.name.outputs.package }}
        path: dist/${{ steps.name.outputs.package }}.zip
        if-no-files-found: error
  build_linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Name the build
      id: name
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="$(git rev-parse --short=12 HEAD)"; fi
        echo "package=msiecfexport-${NAME}-linux-x86_64" >> "${GITHUB_OUTPUT}"
    - name: Install build dependencies
      run: |
        sudo apt -y update
        sudo apt -y install autoconf automake autopoint build-essential git libtool pkg-config
    - name: Download test data
      run: |
        ./synctestdata.sh
    - name: Build from source
      # A static executable runs on any x86-64 Linux without libmsiecf or the
      # libyal libraries installed. Upstream tests this configure combination.
      run: |
        ./synclibs.sh
        ./autogen.sh
        ./configure --disable-multi-threading-support --enable-static-executables
        make -j4 > /dev/null
    - name: Run tests
      run: |
        tests/runtests.sh -j4 VERBOSE=1
    - name: Check the executable is static
      run: |
        file msiecftools/msiecfexport
        file msiecftools/msiecfexport | grep -q 'statically linked'
    - name: Run smoke test
      run: |
        python3 ct/smoke_test.py msiecftools/msiecfexport tests/input/public/index.dat
    - name: Package
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        mkdir -p "dist/${PACKAGE}"
        cp msiecftools/msiecfexport "dist/${PACKAGE}/"
        strip "dist/${PACKAGE}/msiecfexport"
        cp COPYING COPYING.LESSER ct/dependencies.txt "dist/${PACKAGE}/"
        {
          echo "msiecfexport, built from libmsiecf for Cyber Triage."
          echo "Source:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          echo "Build:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Licence: LGPL-3.0-or-later; see COPYING.LESSER and COPYING."
          echo "Dependency versions: see dependencies.txt."
        } > "dist/${PACKAGE}/SOURCE.txt"
        tar -czf "dist/${PACKAGE}.tar.gz" -C dist "${PACKAGE}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.name.outputs.package }}
        path: dist/${{ steps.name.outputs.package }}.tar.gz
        if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs:
    - build_windows
    - build_linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: dist
        merge-multiple: true
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
        gh release create "${GITHUB_REF_NAME}" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --notes "msiecfexport for Cyber Triage, built from ${GITHUB_SHA}. See ct/README.md for what differs from upstream libmsiecf." \
          -- *
